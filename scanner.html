<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leitor • Almoxarifado</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0001;max-width:560px;margin:auto}
h2{margin:0 0 8px}p{color:#6b7280}.status{padding:10px;border-radius:10px;background:#eef2ff;margin:10px 0}.ok{background:#ecfdf5;color:#166534}.erro{background:#fef2f2;color:#991b1b}
.result{font-size:24px;font-weight:bold;text-align:center;padding:14px;background:#ecfdf5;color:#166534;border-radius:12px;margin-top:12px;word-break:break-all}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#111827;color:white;font-weight:bold;font-size:16px;margin-top:10px}#reader{margin-top:12px;width:100%}
.small{font-size:13px;color:#6b7280}
</style>
</head>
<body>
<div class="card">
<h2>📷 Ler código de barras</h2>
<p>Aponte a câmera para o código de barras. O leitor aceita os formatos mais comuns de produtos.</p>
<div id="status" class="status">Solicitando acesso à câmera...</div>
<div id="reader"></div>
<div id="resultado" class="result" style="display:none"></div>
<button onclick="fechar()">Fechar</button>
</div>
<script>
let scanner=null,finalizado=false;
function setStatus(t,cl){const e=document.getElementById('status');e.textContent=t;e.className='status '+(cl||'');}
function iniciar(){
  try{
    const formatos=[
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.QR_CODE
    ];
    scanner=new Html5Qrcode('reader',{formatsToSupport:formatos});
    const config={fps:12,qrbox:function(w,h){return {width:Math.min(Math.floor(w*0.88),420),height:Math.min(Math.floor(h*0.30),180)};},aspectRatio:1.7777778,showTorchButtonIfSupported:true};
    scanner.start({facingMode:'environment'},config,onScanSuccess,(err)=>{}).then(()=>setStatus('📷 Câmera ativa. Centralize o código de barras na área de leitura.','')).catch(err=>{setStatus('Não foi possível acessar a câmera. Verifique a permissão do navegador.','erro');});
  }catch(err){setStatus('Erro ao iniciar o leitor: '+(err.message||err),'erro');}
}
function onScanSuccess(text){
  if(finalizado)return;
  const code=String(text||'').trim();
  if(!code)return;
  finalizado=true;
  document.getElementById('resultado').textContent=code;
  document.getElementById('resultado').style.display='block';
  setStatus('✅ Código lido com sucesso!','ok');
  try{window.opener&&window.opener.postMessage({type:'almoxarifado-barcode',code:code},'*');}catch(e){}
  setTimeout(()=>{
    if(scanner){scanner.stop().catch(()=>{}).finally(()=>{try{scanner.clear()}catch(e){}});}
    if(window.opener) setTimeout(()=>window.close(),250);
  },900);
}
function fechar(){
  if(scanner)scanner.stop().catch(()=>{}).finally(()=>{try{scanner.clear()}catch(e){};window.close();});
  else window.close();
}
window.addEventListener('load',iniciar);
</script>
</body>
</html>
