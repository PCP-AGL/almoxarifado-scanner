<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leitor • Almoxarifado</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0001;max-width:560px;margin:auto}h2{margin:0 0 8px}p{color:#6b7280}.status{padding:10px;border-radius:10px;background:#eef2ff;margin:10px 0}.ok{background:#ecfdf5;color:#166534}.erro{background:#fef2f2;color:#991b1b}button{width:100%;padding:13px;border:0;border-radius:10px;background:#111827;color:white;font-weight:bold;font-size:16px;margin-top:10px}#reader{margin-top:12px;width:100%}</style>
</head>
<body><div class="card"><h2>📷 Ler código de barras</h2><p>Aponte a câmera para o código. Ao ler, você voltará automaticamente ao Almoxarifado.</p><div id="status" class="status">Solicitando acesso à câmera...</div><div id="reader"></div><button onclick="fechar()">Fechar</button></div>
<script>
let scanner=null,finalizado=false;
const params=new URLSearchParams(location.search);
const returnUrl=params.get('returnUrl')||'';
function setStatus(t,cl){const e=document.getElementById('status');e.textContent=t;e.className='status '+(cl||'');}
function iniciar(){scanner=new Html5Qrcode('reader');const config={fps:10,qrbox:{width:300,height:140},aspectRatio:1.7777778};scanner.start({facingMode:'environment'},config,onScanSuccess,()=>{}).then(()=>setStatus('📷 Câmera ativa. Aponte para o código de barras.','')).catch(()=>setStatus('Não foi possível acessar a câmera. Verifique a permissão do navegador.','erro'));}
function onScanSuccess(text){if(finalizado)return;finalizado=true;const code=String(text||'').trim();setStatus('✅ Código lido: '+code,'ok');if(returnUrl){const sep=returnUrl.includes('?')?'&':'?';setTimeout(()=>{location.href=returnUrl+sep+'codigo='+encodeURIComponent(code);},350);}else{setTimeout(()=>{if(scanner)scanner.stop().catch(()=>{}).finally(()=>{try{scanner.clear()}catch(e){}});},350);}}
function fechar(){if(returnUrl){location.href=returnUrl;}else if(scanner)scanner.stop().catch(()=>{}).finally(()=>{try{scanner.clear()}catch(e){};});}
window.addEventListener('load',iniciar);
</script></body></html>
